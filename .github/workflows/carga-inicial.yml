# La carga inicial de la base de producción: la estructura y el contenido de
# partida (packages/db/seed/seed.sql). Se corre UNA vez, a mano, desde la
# pestaña Actions. Si la base ya tiene cualquier dato, no hace nada: nunca
# pisa datos reales.
name: Carga inicial

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribí "cargar" para confirmar'
        required: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  cargar:
    if: ${{ inputs.confirmar == 'cargar' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apuntar a la base de producción
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          test -n "$D1_DATABASE_ID" || { echo "::error::Falta la variable D1_DATABASE_ID"; exit 1; }
          sed -i "s/\"database_id\": \"local\"/\"database_id\": \"$D1_DATABASE_ID\"/" apps/site/wrangler.jsonc

      - name: Crear las tablas
        working-directory: apps/site
        run: npx wrangler d1 migrations apply falco --remote

      - name: Cargar el contenido de partida, sólo si la base está vacía
        working-directory: apps/site
        run: |
          # Cualquier fila en cualquiera de estas tablas es algo cargado a mano
          # (por ejemplo, un café de tolva desde el admin): no se pisa nada.
          consulta="SELECT (SELECT count(*) FROM products) + (SELECT count(*) FROM coffees) + (SELECT count(*) FROM hopper_coffees) + (SELECT count(*) FROM settings) + (SELECT count(*) FROM business_hours) + (SELECT count(*) FROM special_days) AS n"
          filas=$(npx wrangler d1 execute falco --remote --json --command "$consulta" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].results[0].n))')
          if [ "$filas" != "0" ]; then
            echo "::error::La base ya tiene datos ($filas filas entre productos, cafés, tolva, ajustes y horarios): no se carga nada para no pisarlos. Si son pruebas, borralas desde el admin y volvé a correrlo."
            exit 1
          fi
          npx wrangler d1 execute falco --remote --file ../../packages/db/seed/seed.sql
          echo "Listo. Entrá al admin y reemplazá lo de ejemplo por lo real."
