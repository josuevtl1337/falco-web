# Publicar: cada merge a main se prueba y, si pasa, se publica solo.
#
# Orden: tests → cambios de la base (migraciones) → sitio → admin. Si un
# paso falla, los siguientes no corren y lo que estaba publicado sigue igual.
#
# Necesita, en GitHub (Settings → Secrets and variables → Actions):
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   Variables: D1_DATABASE_ID, ACCESS_TEAM, ACCESS_AUD, CF_BEACON_TOKEN
# Ver docs/guia-cloudflare.md.
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nunca dos publicaciones a la vez: la segunda espera a la primera.
concurrency:
  group: publicar
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Tests y typecheck
        run: |
          npm test
          npm run typecheck

      # En el repo el id de la base es "local" (sirve para desarrollo). Acá se
      # reemplaza por el de producción, antes del build, que lo copia.
      - name: Apuntar a la base de producción
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          test -n "$D1_DATABASE_ID" || { echo "::error::Falta la variable D1_DATABASE_ID"; exit 1; }
          sed -i "s/\"database_id\": \"local\"/\"database_id\": \"$D1_DATABASE_ID\"/" apps/site/wrangler.jsonc apps/admin/wrangler.jsonc
          grep -q "$D1_DATABASE_ID" apps/site/wrangler.jsonc

      - name: Cambios de la base (migraciones nuevas)
        working-directory: apps/site
        run: npx wrangler d1 migrations apply falco --remote

      - name: Publicar el sitio
        env:
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
        run: |
          npm run build --workspace @falco/site
          cd apps/site
          if [ -n "$CF_BEACON_TOKEN" ]; then
            npx wrangler deploy --var "CF_BEACON_TOKEN:$CF_BEACON_TOKEN"
          else
            echo "::warning::Sin CF_BEACON_TOKEN: el sitio se publica sin Web Analytics"
            npx wrangler deploy
          fi

      - name: Publicar el admin
        env:
          ACCESS_TEAM: ${{ vars.ACCESS_TEAM }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
        run: |
          # Sin estos datos el admin se publica igual, pero no deja entrar a
          # nadie (auth.ts responde 403): no es un riesgo, pero se avisa.
          if [ -z "$ACCESS_TEAM" ] || [ -z "$ACCESS_AUD" ]; then
            echo "::warning::Faltan ACCESS_TEAM o ACCESS_AUD: el admin no va a dejar entrar a nadie"
          fi
          npm run build --workspace @falco/admin
          cd apps/admin
          npx wrangler deploy --var "ACCESS_TEAM:$ACCESS_TEAM" --var "ACCESS_AUD:$ACCESS_AUD"
