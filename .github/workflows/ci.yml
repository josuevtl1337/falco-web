# Tests y typecheck en cada PR y en cada push a una rama que no es main.
# Si algo falla, GitHub lo marca en el PR antes de mergear.
name: Tests

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
