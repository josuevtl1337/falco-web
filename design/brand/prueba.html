<!doctype html>
<meta charset="utf-8">
<title>Logo Falco — prueba de tamaños</title>
<style>
  body { margin: 0; background: #292A2C; color: #E8E2D0;
         font: 14px system-ui, sans-serif; padding: 32px; }
  h2 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
       color: #9A9C9E; font-weight: 600; margin: 32px 0 12px; }
  .fila { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; }
  .claro { background: #E8E2D0; padding: 24px; }
  img { display: block; }
</style>

<h2>Sobre carbón — 320 / 180 / 96 px de ancho</h2>
<div class="fila">
  <img src="logo-falco.svg" width="320" alt="Falco">
  <img src="logo-falco.svg" width="180" alt="Falco">
  <img src="logo-falco.svg" width="96" alt="Falco">
</div>

<h2>Sobre hueso (el mismo archivo, fondo claro)</h2>
<div class="fila claro">
  <img src="logo-falco.svg" width="320" alt="Falco">
  <img src="logo-falco.svg" width="96" alt="Falco">
</div>

<h2>Versión con la tarjeta incluida</h2>
<div class="fila">
  <img src="logo-falco-sobre-carbon.svg" width="420" alt="Falco">
</div>
